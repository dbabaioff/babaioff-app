<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Audio Player</title>
<style>
  :root {
    --primary: #007bff;
    --bg: #f8f9fa;
    --hover: #e0e0e0;
    --active: #cce5ff;
    --now-playing-bg: #1a1a2e;
    --now-playing-text: #ffffff;
    --progress-bg: rgba(255,255,255,0.2);
    --progress-fill: #4fc3f7;
    --now-playing-height: 90px;
  }

  body {
    font-family: system-ui, sans-serif;
    margin: 0;
    padding: 20px;
    padding-bottom: calc(var(--now-playing-height) + 20px);
    background: var(--bg);
    color: #333;
    text-align: center;
  }

  h2 {
    font-size: 1.6rem;
    margin-bottom: 20px;
  }

  .categories {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 16px;
    max-width: 500px;
    margin: 20px auto 0;
  }

  .category {
    background: white;
    border-radius: 12px;
    padding: 30px 10px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    font-size: 1.2rem;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .category:hover {
    background: var(--hover);
    transform: translateY(-2px);
  }

  #videoList {
    display: none;
    list-style: none;
    padding: 0;
    margin: 20px auto 0;
    max-width: 600px;
  }

  li {
    background: white;
    margin: 12px 0;
    padding: 12px 14px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }

  li:hover { background: var(--hover); transform: translateY(-2px); }
  li.active { background: var(--active); }

  li img {
    width: 100px;
    height: 75px;
    border-radius: 8px;
    object-fit: cover;
    flex-shrink: 0;
  }

  li span {
    flex-grow: 1;
    font-size: 1.05rem;
    line-height: 1.3;
    text-align: center;
  }

  #player {
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
    position: absolute;
  }

  #toolbar {
    position: sticky;
    top: 0;
    z-index: 999;
    background: var(--bg);
    padding: 8px;
    display: flex;
    justify-content: center;
    gap: 8px;
    border-bottom: 1px solid #ddd;
  }

  #toolbar button {
    padding: 6px 12px;
    font-size: 0.9rem;
    border-radius: 6px;
    border: none;
    background: var(--primary);
    color: white;
    cursor: pointer;
  }
  #toolbar button:hover { background: #0056b3; }

  /* ── NOW PLAYING BAR ── */
  #nowPlayingBar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: var(--now-playing-height);
    background: var(--now-playing-bg);
    color: var(--now-playing-text);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 16px;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.35);
    z-index: 1000;
    transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  #nowPlayingBar.visible {
    transform: translateY(0);
  }

  /* Top row: thumbnail + title + controls */
  .np-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }

  #npThumb {
    width: 44px;
    height: 33px;
    border-radius: 5px;
    object-fit: cover;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #npThumb.loaded { opacity: 1; }

  #npTitle {
    flex-grow: 1;
    font-size: 0.88rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: 0.01em;
  }

  .np-controls {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .np-btn {
    background: none;
    border: none;
    color: white;
    font-size: 1.3rem;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
    line-height: 1;
    transition: background 0.15s;
  }
  .np-btn:hover { background: rgba(255,255,255,0.15); }
  .np-btn:active { background: rgba(255,255,255,0.25); }

  /* Bottom row: time + progress slider */
  .np-progress-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .np-time {
    font-size: 0.72rem;
    color: rgba(255,255,255,0.65);
    font-variant-numeric: tabular-nums;
    min-width: 34px;
    flex-shrink: 0;
  }
  .np-time.right { text-align: right; }

  /* Custom range slider */
  #progressSlider {
    flex-grow: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 2px;
    background: var(--progress-bg);
    outline: none;
    cursor: pointer;
    position: relative;
  }

  #progressSlider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--progress-fill);
    cursor: pointer;
    box-shadow: 0 0 4px rgba(79,195,247,0.7);
    transition: transform 0.1s;
  }
  #progressSlider::-webkit-slider-thumb:hover { transform: scale(1.3); }

  #progressSlider::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--progress-fill);
    cursor: pointer;
    border: none;
  }

  /* filled track via background gradient */
  #progressSlider {
    background: linear-gradient(
      to right,
      var(--progress-fill) 0%,
      var(--progress-fill) var(--progress-pct, 0%),
      var(--progress-bg) var(--progress-pct, 0%),
      var(--progress-bg) 100%
    );
  }

  @media (max-width: 480px) {
    h2 { font-size: 1.3rem; }
    .category { padding: 25px 5px; font-size: 1rem; }
    li { padding: 14px 16px; gap: 16px; }
    li img { width: 120px; height: 90px; }
    li span { font-size: 1rem; }
    #npTitle { font-size: 0.8rem; }
  }

  #skipBack,
  #skipForward {
      display: none;
  }
</style>
</head>
<body>

<h2 id="pageTitle">🎧 Choose a Category</h2>

<div id="toolbar">
  <button id="backButton">⬅ Back</button>
  <button id="skipBack">⏪ 10s</button>
  <button id="skipForward">⏩ 10s</button>
</div>

<div class="categories" id="categoryScreen">
  <div class="category" data-category="music">🎵<br>שירים</div>
  <div class="category" data-category="shiurim">📖<br>שיעורים</div>
  <div class="category" data-category="links">🔗<br>Url</div>
  <div class="category" data-category="games">🎮<br><a href="game.html">משחקים</a></div>
</div>

<div class="categories" id="subcategoryScreen" style="display:none;"></div>
<div id="linksScreen" style="display:none; max-width:600px; margin:auto;">
    <input
        id="youtubeUrl"
        type="text"
        placeholder="Paste YouTube URL"
        style="width:100%;padding:12px;font-size:16px;"
    >
    <button
        id="playLinkBtn"
        style="margin-top:10px;padding:10px 20px;"
    >
        Play
    </button>
</div>

<ul id="videoList"></ul>

<div id="player"></div>

<!-- NOW PLAYING BAR -->
<div id="nowPlayingBar">
  <div class="np-top">
    <img id="npThumb" src="" alt="">
    <span id="npTitle">—</span>
    <div class="np-controls">
      <button class="np-btn" id="npPrevBtn" title="Previous">⏮</button>
      <button class="np-btn" id="npPlayPauseBtn" title="Play/Pause">▶</button>
      <button class="np-btn" id="npNextBtn" title="Next">⏭</button>
    </div>
  </div>
  <div class="np-progress-row">
    <span class="np-time" id="npCurrentTime">0:00</span>
    <input type="range" id="progressSlider" min="0" max="100" value="0" step="0.1">
    <span class="np-time right" id="npDuration">0:00</span>
  </div>
</div>

<script>
let videoData = null;
fetch('videos.json')
  .then(res => res.json())
  .then(data => { videoData = data; })
  .catch(err => console.error('Failed to load videos.json', err));

let currentListItems = [];
let currentVideoId = null;
let isPlaying = false;
let isSeeking = false;
let progressInterval = null;

// Load YouTube API
const tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
document.body.appendChild(tag);

let player;

function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    height: '1', width: '1', videoId: '',
    playerVars: { autoplay: 0, controls: 0, modestbranding: 1 },
    events: { onStateChange: onPlayerStateChange }
  });
}

function onPlayerStateChange(event) {
  isPlaying = event.data === YT.PlayerState.PLAYING;
  updatePlayPauseUI();

  if (event.data === YT.PlayerState.PLAYING) {
    startProgressPolling();
  } else {
    stopProgressPolling();
    if (event.data === YT.PlayerState.ENDED) {
      playAdjacentVideo(1);
    }
  }
}

// ── PROGRESS POLLING ──────────────────────────────────────────
function startProgressPolling() {
  stopProgressPolling();
  progressInterval = setInterval(updateProgress, 500);
}

function stopProgressPolling() {
  if (progressInterval) { clearInterval(progressInterval); progressInterval = null; }
}

function updateProgress() {
  if (!player || !player.getCurrentTime || isSeeking) return;
  const current = player.getCurrentTime() || 0;
  const duration = player.getDuration() || 0;
  if (duration === 0) return;

  const pct = (current / duration) * 100;
  const slider = document.getElementById('progressSlider');
  slider.value = pct;
  slider.style.setProperty('--progress-pct', pct + '%');

  document.getElementById('npCurrentTime').textContent = formatTime(current);
  document.getElementById('npDuration').textContent = formatTime(duration);
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

// ── NOW PLAYING BAR ──────────────────────────────────────────
function showNowPlayingBar(video) {
  const bar = document.getElementById('nowPlayingBar');
  const thumb = document.getElementById('npThumb');
  const title = document.getElementById('npTitle');

  thumb.classList.remove('loaded');
  thumb.src = thumbUrl(video.id);
  thumb.onload = () => thumb.classList.add('loaded');
  title.textContent = video.title;
  title.dir = autoDir(video.title);

  bar.classList.add('visible');
}

function updatePlayPauseUI() {
  document.getElementById('npPlayPauseBtn').textContent = isPlaying ? '⏸' : '▶';
}

// ── PLAY LOGIC ───────────────────────────────────────────────
function playVideo(videoId) {
  const video = currentListItems.find(v => v.id === videoId);
  if (!video) return;

  currentVideoId = videoId;
  player.loadVideoById(videoId);
  showNowPlayingBar(video);

  // Reset progress
  document.getElementById('progressSlider').value = 0;
  document.getElementById('progressSlider').style.setProperty('--progress-pct', '0%');
  document.getElementById('npCurrentTime').textContent = '0:00';
  document.getElementById('npDuration').textContent = '0:00';

  highlightActiveTrack(videoId);
  scrollToActiveTrack(videoId);
}

function highlightActiveTrack(videoId) {
  document.querySelectorAll('#videoList li').forEach(el => {
    el.classList.toggle('active', el.dataset.id === videoId);
  });
}

function scrollToActiveTrack(videoId) {
  const li = document.querySelector(`#videoList li[data-id="${videoId}"]`);
  if (li) {
    li.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

function playAdjacentVideo(direction) {
  if (!currentVideoId || currentListItems.length === 0) return;
  const index = currentListItems.findIndex(v => v.id === currentVideoId);
  if (index === -1) return;
  const nextIndex = index + direction;
  if (nextIndex < 0 || nextIndex >= currentListItems.length) return;
  playVideo(currentListItems[nextIndex].id);
}

// ── NOW PLAYING CONTROLS ─────────────────────────────────────
document.getElementById('npPlayPauseBtn').addEventListener('click', () => {
  if (!player || !currentVideoId) return;
  isPlaying ? player.pauseVideo() : player.playVideo();
});

document.getElementById('npPrevBtn').addEventListener('click', () => playAdjacentVideo(-1));
document.getElementById('npNextBtn').addEventListener('click', () => playAdjacentVideo(1));

// ── PROGRESS SLIDER ───────────────────────────────────────────
const slider = document.getElementById('progressSlider');

slider.addEventListener('mousedown', () => { isSeeking = true; });
slider.addEventListener('touchstart', () => { isSeeking = true; }, { passive: true });

slider.addEventListener('input', () => {
  if (!player || !player.getDuration) return;
  const pct = parseFloat(slider.value);
  slider.style.setProperty('--progress-pct', pct + '%');
  const duration = player.getDuration() || 0;
  document.getElementById('npCurrentTime').textContent = formatTime((pct / 100) * duration);
});

slider.addEventListener('change', () => {
  if (!player || !player.getDuration) return;
  const pct = parseFloat(slider.value);
  const duration = player.getDuration() || 0;
  player.seekTo((pct / 100) * duration, true);
  isSeeking = false;
});

slider.addEventListener('mouseup', () => { isSeeking = false; });
slider.addEventListener('touchend', () => { isSeeking = false; });

// ── NAVIGATION ────────────────────────────────────────────────
function autoDir(text) {
  return /[֐-׿]/.test(text) ? "rtl" : "ltr";
}

function thumbUrl(id) {
  return `https://img.youtube.com/vi/${id}/mqdefault.jpg`;
}

function renderInto(container, items, buildItem) {
  container.innerHTML = '';
  items.forEach(item => container.appendChild(buildItem(item)));
}

const screens = {
  category: document.getElementById('categoryScreen'),
  subcategory: document.getElementById('subcategoryScreen'),
  videoList: document.getElementById('videoList'),
  links: document.getElementById('linksScreen'),
};
const backButton = document.getElementById('backButton');
const SCREEN_DISPLAY = { category: 'grid', subcategory: 'grid', videoList: 'block', links: 'block' };
const SCREEN_TITLE = {
  category: '🎧 Choose a Category',
  subcategory: '📂 Choose a Subcategory',
  videoList: '🎧 Choose a Track',
  links: '🔗 Play YouTube Link',
};

function showScreen(name) {
  for (const key of Object.keys(screens)) {
    screens[key].style.display = key === name ? SCREEN_DISPLAY[key] : 'none';
  }
  document.getElementById('pageTitle').textContent = SCREEN_TITLE[name];
  backButton.style.display = name === 'category' ? 'none' : '';
}

// Push a history entry per drill-down so the phone's physical/gesture back
// button (which triggers popstate in a WebView) steps back one screen
// instead of exiting the app.
function navigateTo(name) {
  history.pushState({ screen: name }, '', location.href);
  showScreen(name);
}

window.addEventListener('popstate', e => {
  if (player && isPlaying) player.pauseVideo();
  showScreen((e.state && e.state.screen) || 'category');
});

showScreen('category');
history.replaceState({ screen: 'category' }, '', location.href);

document.getElementById('categoryScreen').addEventListener('click', e => {
  const cat = e.target.closest('.category');
  if (!cat) return;

  if (cat.dataset.category === 'links') {
      navigateTo('links');
      return;
  }

  if (!videoData || !videoData[cat.dataset.category]) return;
  showSubcategories(cat.dataset.category);
});

function showSubcategories(category) {
  renderInto(screens.subcategory, Object.keys(videoData[category]), sub => {
    const div = document.createElement('div');
    div.className = 'category';
    div.textContent = sub;
    div.dataset.category = category;
    div.dataset.subcategory = sub;
    return div;
  });
  navigateTo('subcategory');
}

document.getElementById('subcategoryScreen').addEventListener('click', e => {
  const sub = e.target.closest('.category');
  if (!sub) return;
  showVideoList(sub.dataset.category, sub.dataset.subcategory);
});

function showVideoList(category, subcategory) {
  currentListItems = videoData[category][subcategory];

  renderInto(screens.videoList, currentListItems, v => {
    const li = document.createElement('li');
    li.dataset.id = v.id;
    if (v.id === currentVideoId) li.classList.add('active');

    const img = document.createElement('img');
    img.src = thumbUrl(v.id);
    img.alt = v.title;

    const span = document.createElement('span');
    span.textContent = v.title;
    span.dir = autoDir(v.title);

    li.appendChild(img);
    li.appendChild(span);
    return li;
  });

  navigateTo('videoList');

  // If something is already playing in this list, scroll to it
  if (currentVideoId) scrollToActiveTrack(currentVideoId);
}

function extractYoutubeId(url) {
    try {
        const parsed = new URL(url);

        // youtu.be/VIDEO_ID
        if (parsed.hostname.includes('youtu.be')) {
            return parsed.pathname.slice(1);
        }

        // youtube.com/watch?v=VIDEO_ID
        const watchId = parsed.searchParams.get('v');
        if (watchId) {
            return watchId;
        }

        // youtube.com/live/VIDEO_ID
        const liveMatch = parsed.pathname.match(/^\/live\/([^/?]+)/);
        if (liveMatch) {
            return liveMatch[1];
        }

        return null;
    } catch {
        return null;
    }
}

document.getElementById('playLinkBtn').addEventListener('click', () => {
    const url = document.getElementById('youtubeUrl').value.trim();

    const videoId = extractYoutubeId(url);

    if (!videoId) {
        alert('Invalid YouTube URL');
        return;
    }

    currentListItems = [{
        id: videoId,
        title: 'Custom YouTube Link'
    }];

    playVideo(videoId);
});

document.getElementById('backButton').addEventListener('click', () => {
  history.back();
});

document.getElementById('videoList').addEventListener('click', e => {
  const li = e.target.closest('li');
  if (!li) return;
  const videoId = li.dataset.id;

  if (videoId === currentVideoId) {
    isPlaying ? player.pauseVideo() : player.playVideo();
  } else {
    playVideo(videoId);
  }
});

document.getElementById('skipBack').addEventListener('click', () => {
  if (!player) return;
  player.seekTo(Math.max(0, player.getCurrentTime() - 10), true);
});

document.getElementById('skipForward').addEventListener('click', () => {
  if (!player) return;
  player.seekTo(player.getCurrentTime() + 10, true);
});
</script>
</body>
</html>
