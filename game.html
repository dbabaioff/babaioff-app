<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>משחקים מהנים!</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Rubik:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sky:    #fff9f0;
      --yellow: #ffd54f;
      --orange: #ff7043;
      --green:  #66bb6a;
      --blue:   #42a5f5;
      --pink:   #f06292;
      --purple: #ab47bc;
      --dark:   #3d2314;
      --white:  #ffffff;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--sky);
      background-image:
        radial-gradient(circle at 15% 20%, #ffd54f33 0%, transparent 35%),
        radial-gradient(circle at 85% 10%, #42a5f533 0%, transparent 35%),
        radial-gradient(circle at 50% 90%, #f0629233 0%, transparent 35%);
      font-family: 'Rubik', sans-serif;
      min-height: 100vh;
      padding: 32px 20px 60px;
    }

    .star { position: fixed; pointer-events: none; font-size: 22px; animation: floatStar linear infinite; opacity: 0.2; z-index: 0; }
    @keyframes floatStar {
      0%   { transform: translateY(110vh) rotate(0deg); }
      100% { transform: translateY(-10vh) rotate(360deg); }
    }

    header { text-align: center; margin-bottom: 40px; position: relative; z-index: 1; }

    .header-title {
      font-family: 'Rubik', sans-serif;
      font-weight: 900;
      font-size: clamp(36px, 8vw, 72px);
      color: var(--orange);
      -webkit-text-stroke: 3px var(--dark);
      text-shadow: 4px 4px 0 var(--dark);
      letter-spacing: 1px;
      animation: titleBounce 2s ease-in-out infinite;
      display: inline-block;
    }

    @keyframes titleBounce {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50%       { transform: translateY(-8px) rotate(1deg); }
    }

    .header-sub {
      margin-top: 8px;
      font-size: clamp(16px, 3vw, 22px);
      font-weight: 700;
      color: var(--purple);
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 28px;
      max-width: 1100px;
      margin: 0 auto;
      position: relative; z-index: 1;
    }

    .game-card {
      background: var(--white);
      border-radius: 24px;
      border: 4px solid var(--dark);
      box-shadow: 6px 6px 0 var(--dark);
      overflow: hidden;
      cursor: pointer;
      text-decoration: none;
      display: block;
      transition: transform 0.18s cubic-bezier(.34,1.56,.64,1), box-shadow 0.18s;
    }

    .game-card:hover {
      transform: translateY(-8px) rotate(-0.5deg) scale(1.02);
      box-shadow: 10px 14px 0 var(--dark);
    }

    .game-card:active {
      transform: translateY(-2px) scale(0.98);
      box-shadow: 4px 4px 0 var(--dark);
    }

    .card-header {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 18px;
      border-bottom: 4px solid var(--dark);
    }
    .card-header.green  { background: #a5d6a7; }
    .card-header.blue   { background: #90caf9; }
    .card-header.pink   { background: #f48fb1; }
    .card-header.yellow { background: #fff176; }

    .card-emoji { font-size: 32px; line-height: 1; }
    .card-title { font-family: 'Rubik', sans-serif; font-weight: 900; font-size: 22px; color: var(--dark); }

    .card-body {
      padding: 24px 16px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      min-height: 160px;
    }

    .card-big-emoji {
      font-size: 60px;
      animation: wobble 2.5s ease-in-out infinite;
    }
    @keyframes wobble {
      0%, 100% { transform: rotate(-6deg); }
      50%       { transform: rotate(6deg); }
    }

    .card-cta {
      font-family: 'Rubik', sans-serif;
      font-weight: 900;
      font-size: 17px;
      padding: 10px 26px;
      background: var(--green);
      color: var(--dark);
      border: 3px solid var(--dark);
      border-radius: 50px;
      box-shadow: 3px 3px 0 var(--dark);
      transition: transform 0.15s cubic-bezier(.34,1.56,.64,1);
    }

    .game-card:hover .card-cta {
      transform: scale(1.08);
      background: #43a047;
    }

    .coming-soon-label {
      font-family: 'Rubik', sans-serif;
      font-weight: 700;
      font-size: 15px; color: #bbb;
      background: #f5f5f5;
      border: 2.5px dashed #ddd;
      border-radius: 50px;
      padding: 6px 20px;
    }

    /* stagger wobble */
    .game-card:nth-child(2) .card-big-emoji { animation-delay: 0.3s; }
    .game-card:nth-child(3) .card-big-emoji { animation-delay: 0.6s; }
    .game-card:nth-child(4) .card-big-emoji { animation-delay: 0.9s; }

    @media (max-width: 480px) { .games-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

</html>
